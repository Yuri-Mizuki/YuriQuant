name: Fast checks (manual)

# 2026-09-10 二次调整：用户拍板「真·静音」——push 不再触发任何工作流。
# 本文件原先的 push / pull_request 触发已移除，只保留手动 workflow_dispatch。
#
# 为什么这么定：仓库 public + master 无分支保护，CI 从来不是门禁、拦不住 push，
# 唯一产物就是页面上的红叉、失败邮件和等待时间。前两轮已把成本压到底
# （全量 pytest 拆出：474s → 115s；快检查去掉 torch 安装：115s → 60s），
# 本轮干脆断开自动触发，从源头消除噪声。
#
# 触发方式（三选一）：
#   1. 仓库 Actions 页 → "Fast checks (manual)" → Run workflow
#   2. 本机 `gh workflow run ci.yml`
#   3. 本机 `D:/python/Python312/python.exe -m pytest -q`（数据齐全，最完整）
# 全量套件见 full-tests.yml，同样是手动触发。
#
# 快检查刻意不装 torch（不含 rl extra）：三个分层守卫均不 import torch
# （torch 只出现在 factor/gflownet/ 与 scripts/textmining/），省掉约 200MB 下载。
# 验证脚本见 scripts/oneoff/ci_torch_check.py。若日后守卫测试要用 torch，
# 需同时处理 CPU index（--index-url https://download.pytorch.org/whl/cpu），
# 否则 rl extra 里的 torch>=2.0 会从 PyPI 拉 CUDA 版（约 2.5GB）。

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # 不装 torch / rl extra：本 job 只跑 Ruff + 三个分层守卫，均不依赖 torch。
          pip install -e ".[dev,ml,gp,solver]"

      - name: Check dependency lock in sync
        # uv.lock 是跨平台解析锁（uv lock 生成），此处只守卫其与 pyproject.toml 同步，
        # 安装仍走上方 pip（CPU torch 需要自定义 index，uv sync 不便表达）。
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv lock --check

      - name: Ruff critical rules
        # 只盯"真 bug"规则（未定义名/重复定义/format 占位符），风格类告警不入 CI 门禁
        run: ruff check . --select F821,F811,F522,F523,F632 --output-format concise

      - name: Layer & convention guards
        # tee 落盘供下方 Surface failures 提取失败行
        run: |
          set -o pipefail
          pytest -q --tb=short \
            tests/test_layering.py tests/test_pipeline_layers.py tests/test_data_layer.py \
            2>&1 | tee /tmp/pytest.log

      - name: Surface failures
        # 失败时把 FAILED 行推到 check annotations、把日志尾部写进 job summary，
        # 便于从 API/摘要页直接定位，无需翻原始日志。日志可能不存在（如 Ruff 先挂），
        # 故整体做存在性守卫——否则本步自身会因 tail/grep 返回非零而报错，制造噪声。
        if: failure()
        run: |
          if [ -s /tmp/pytest.log ]; then
            {
              echo "## Pytest tail (last 120 lines)"
              echo '```'
              tail -n 120 /tmp/pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^(FAILED|ERROR) " /tmp/pytest.log | head -30 | while IFS= read -r line; do
              echo "::error ::$line"
            done
          fi
