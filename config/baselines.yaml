# =============================================================================
# 定版主模型登记表 —— 全项目**唯一真源**（2026-10-13 建立，2026-10-14 加口径组合）
# =============================================================================
#
# 规则（改本文件前必读）
# --------------------
# 1. **每次定版追加一条**，`id` 单调递增（v1 / v2 / ...）；旧条目不删，`status`
#    改 `superseded` 并注明被谁取代。历史结论靠这个表追溯「当时对比的是谁」。
# 2. **metrics 必须由 `scripts/evaluation/caliber.py` 产出**，且**必须标口径组合**
#    （`profiles.production` / `profiles.fair`）。手工填的数字一律标
#    `verified_local: false` 并注明来源。
# 3. **任何"改进 vs 基线"的对照，基线必须取本表 `status: production` 那条**
#    （或 `working` 那条作本机代理），不得临时自造基线 —— 2026-10-13 一天内
#    三次结论反转全部源于此。
# 4. **口径组合不可混**（2026-10-14 新增，见 `caliber.PROFILES`；2026-11-12 成本改 27bp）：
#      production = **27bp 时变**（佣金万1双边2 + 印花税单边5、2023-08-28 前 10 + 滑点10bp双边20）
#                   + T+1 open + 1e6   ← 与定版同源，**绝对数字可比**
#      fair       = 逐股冲击  + T 收盘  + 1e8   ← 成本/容量研究用，**不可与 production 并列**
#    同一 signal + 同一 arm 在两者间差 ~0.77pp（其中 0.70pp 来自 close vs T+1 open）。
#    🚨 **2026-11-12 起「固定 10bp」文案全部作废**：此前登记的 10bp/36bp 数字
#    （v1/v1w*/v2-dingban 与 yqcore 三档的旧值）**不可与新数字相减**；
#    同一臂 36bp→27bp 约 +0.8~1.0pp，幅度随换手放大（solo 92% 换手 +1.01pp、
#    focus 87% +0.84pp、breadth 17% +0.15pp）。
# 5. **数据态必须标注**：v1 的 18.07% 属 income 4383 补齐**前**的 v2 数据态；
#    同配置当前数据态 ≈ 17.0–17.2%（README:24-26）。**不回退数据换数字。**
# 6. **掩码口径 = 方案② mask-lag 1**（由莉酱 2026-10-15 拍板）：报数一律
#    「--mask-lag 1 + T+1 open」可执行口径（现值即此，零改动）；mask-lag 0 +
#    T 收盘仅研究上限对照，数字不得与报数并列。提频实验先读
#    `reports/docs/consistency_checks/口径核对_掩码取样日错配.md`（周频 +3.76pp）。
# 7. **2026-10-19 执行价口径修复（审计 P0-1）**：`build_execution_split` 必须收
#    **信号日 T**、引擎 `rebalance_days` 收**执行日 E=T+1**。修复前 9 处调用把 E
#    同时传给两者 ⇒ fill 落 E+1、`open` 臂实际是 T+1 收盘成交。**修复前所有
#    `open` 数字须视作旧口径**：882 代理已重跑（v1w-ortho882 production 16.39/0.681）；
#    920 线（v1/v1w2）因本机无 pred 尚未重跑，引用时须注明「pre-exec-fix」。
# 8. **显著性口径（2026-10-28 新增）**：`sharpe_t_stat` / `years_to_prove(_arith)` 现在由
#    `caliber._metrics` 直接产出（此前 caliber 自己拼 dict、不调 `calc_all_metrics`
#    ⇒ 走 caliber 的每条结论都缺这三个）。`t = SR·√T` 里的 SR **必须是算术**：
#    只有 `years_to_prove_arith` 与 t 统计量同口径；`years_to_prove`（几何）仅在
#    **正收益**时偏保守（v1w 实测虚高 31%），负收益/近零时反而虚短 ⇒
#    **跨策略比较一律用 `_arith`**。推导与反例见 `backtest/metrics.py::sharpe_arithmetic`。
# 9. **重建面板后必须先重构造信号，再报数**（2026-11-08 新增）：`caliber.SIGNALS` 读的是
#    **落盘的** predict 面板，定版信号里慢信号那一半来自 `panels_neu` —— 面板重算后
#    信号面板不会自己变，caliber 会静默读到旧数据态。重建流程固定为：
#    `buffer_arm_920 --variant defv --save-sig <SIGNALS.path> --sig-only` → `caliber`。
#    🔑 信号落盘时**不要 shift**：T+1 由 `run_once` 内部 `shift(1)` 实现，落盘前 shift
#    等于 T+2 成交（比生产慢一天，且数字看起来仍然"合理"）。
#    🔑 窗口对照**不能靠截断日收益**：buffer 策略的首月持仓取决于"从哪天冷启动"，
#    截断 2019 前的收益得到的是"2018 起跑再扔掉前一年"，不是"2019 起跑"（实测差 0.12pp）。
#    要换窗口就重跑 `caliber --window`；要对比数据态就 `--signal-path` 换面板重跑。
# 10. **同族多档位 ≠ 版本更替**（2026-11-10 新增，为 `yqcore` 而立）：一个策略族可以有
#    多条同时 `status: production` 的档位（`family` 相同、`tier` 不同），适用**不同的资金
#    规模 / 持仓宽度**，彼此不取代。此时规则 3 的「基线取 production 那条」须指定档位，
#    不得含糊说「定版」。已有互斥版本关系（v1→v2）仍然逐条 `superseded`。
#    🔑 分档的**唯一合法依据**是「同一信号在不同持仓宽度下的收益形状不同」，且须有
#    同口径实测支撑；不得因为「这条数字更好看」而另立一档。
#    🔑 同族多档时**必须**有一档标 `default: true` —— 规则 3 的「基线取 production 那条」
#    靠它唯一定位。无 `family` 的老条目仍受「全局仅一条 production」约束（v1→v2 线性更替），
#    两条约束由 `tests/test_caliber.py::test_registry_schema_and_invariants` 守着。
#
# 11. **复合信号必须登记在 `caliber.SIGNALS` 的 `components` 里**（2026-11-10 新增）：
#    多份 pred 面板的（加权）截面秩平均没有落盘实体，由 `load_context` 现场构造
#    （`weighted_rank_average`）。**禁止在脚本里另写一套平均** —— 平均口径差一点
#    （等权 vs 加权、交集 vs 并集、NaN 处理）就会让同一信号在两处给出不同数字。
#    🔑 复合信号的 `fingerprint` 是**构造后**面板的指纹，与任一分量都不同；引用它的
#    结论必须同时写构造式（哪些分量、什么权重）。
#
# 12. **定版策略只放在 `yqcore` 族里**（2026-11-12 由莉酱拍板）：
#    `yqcore-solo/focus/breadth` 是**唯一**的定版策略集合，判「改进 vs 基线」的默认对象是
#    族内 `default: true` 的 `yqcore-breadth`。**不再新增无 `family` 的 production 条目** ——
#    同一条策略另立一个版本号，只会让"同一批持仓报两个数"（v2-dingban 与 breadth 就是如此：
#    同信号、同执行层、同 `buffer(15/40)`，只差资金/整手/末窗，21.57% vs 21.66%）。
#    🔑 历史条目（`superseded` / `working`）保留在 `baselines:` 或 `retired:` 段里做追溯，
#    但**不得**出现在「定版有哪几个」的答案里。`tests/test_caliber.py` 守着这条不变量
#    （无 family 的 production 条目数 ≤ 1；`yqcore` 族内必须恰有一档 default）。
#
# 每个 baseline 的字段
# --------------------
#   id                 唯一标识
#   status             production（当前生产）/ working（本机迭代代理）/ superseded
#   signal_key         对应 caliber.SIGNALS 的键（决定读哪份 predict 面板）
#   window             对应 caliber.WINDOWS 的键。**2026-11-05 起 `prod` = 2019 起**；
#                      2018 起的旧条目一律写 `prod2018`（含无掩码年份，历史口径）
#   signal / execution 口径描述（供人读，也是重建参数的记录）
#   caliber            该条数字对应的**口径组合**（profile/cost/execution/capital/脚本）
#   data_state         数据态（income 补齐前后）与当前态等效值
#   metrics            该口径下的实测/记载指标（按 profile 分组）
#   fingerprint        信号面板指纹（caliber.fingerprint_panel；仅本机可复现时有）
#   reproducible_local 本机是否已具备可复现实体
#   regen_cmd          本机重建命令（reproducible_local=false 时必填）
#   source             数字出处（报告路径 / 命令）
# =============================================================================

version: 6
updated: "2026-11-12"

# 评估口径的规范值（caliber.py 的硬编码副本，供快速查阅；改 caliber 时同步）
conventions:
  windows:
    prod: "20190101"      # 主口径（2026-11-05 起）：2018 缺可执行性掩码，与 2019+ 不同源
    prod2018: "20180101"  # 历史口径：含缺掩码年份，仅用于追溯旧登记值，不得用于新结论
    iso2019: "20190101"   # = prod 的兼容别名（旧脚本仍按此名调用）
  sharpe: "geometric"     # backtest.metrics.sharpe_ratio（几何年化/年化波动）
  rebalance: "monthly_first_trading_day"
  covariance_warmup: "untruncated_history"   # Σ 面板不得截断到回测窗口
  # --- 口径组合（2026-10-14；对应 caliber.PROFILES；2026-11-12 成本改 27bp）---
  profiles:
    production:
      cost: "production"        # = default_costs()：往返 27bp 时变（万1双边 + 印花万5单边 + 滑点10bp双边）
      execution: "open"         # T+1 开盘（build_execution_split + 信号 shift(1) 预掩码）
      capital: 1.0e6
      comparable_to: "登记表 status:production 条目"
    fair:
      cost: "impact"            # 逐股平方根律 η·σ·√(Q/ADV)，买卖非对称
      execution: "close"        # T 收盘成交（乐观上限）
      capital: 1.0e8
      comparable_to: "仅同 profile 内部；**不可**与 production 并列"

