      九个区间全含 0）；真正确定的是**整手约束的实投率**：10 万本金下 K=15 只能建
      **82.3%** 仓位（等效年化 23.7%）、K=8 建 92.3%（等效 28.6%）、K=5 建 96.6%
      （等效 30.2%）；20 万时分别为 90.2 / 97.6 / 97.7%，50 万以上都 ≥96%。
      ⇒ **10 万用 k=8**（单票 12.5%）、20 万+ 用默认 15、50 万+ 可到 25、
      10 万且能承受单票 20% 才用 k=5。旧文案「10 万用 k=15、整手偏差 ~6%」是
      「6667 元 ÷ 2200 元/手 ≈ 3 手」的手算，实测 −17.7%，**差 3 倍**。
      证据 `reports/focus_holding/README.md` §2.4。
      **权重维持等权**：9 种加权方案 × 5 个 K 全在 ±2pp、配对 bootstrap 全不显著
      （最强候选 `tier` K=10 +1.17pp CI[−1.79,+3.97]，且 K=5 反向 −4.7pp）；
      把权重压给信号头部（`softmax` 给第一名 40%、`rank_over` 给 30%）反而亏
      2.7~14.9pp，`inv_vol` 随强度单调恶化（−0.56 → −1.09 → −2.11pp）
      ⇒ **等权已接近最优，有实测与机制双重支撑，不是默认值**。
      🚨 另：去掉中间期的两条臂 IS/OOS 跨格秩相关 −0.71 / −0.66（p<0.02）；
      本臂 ρ=+0.27（不显著，但不反向）⇒ 仍不许按历史最优格挑 K。
      🚨 **验证边界**：随机选 15 只为 6.76%±3.66pp（20 次）⇒ 本档 +6.0σ；逐年 8/8 正。
      但**没有**做过「按 2019-2023 定参、2024-2026 验证」的完整滚动窗口 —— 信号与
      权重都是在全样本上选的（权重只有 1 个自由度，且有去一臂机制支撑，非网格搜索）。
      ⚠️ 成交额分位仅 **0.186**、股价中位 21.1 元 ⇒ 组合系统性偏小盘；15 只等权意味
      单票 6.7%，一只暴雷 −6.7%。回测的 ST/退市掩码挡不住突发财务造假。

