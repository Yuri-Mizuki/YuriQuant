# =============================================================================
# 截面选股池排除清单 —— 全项目唯一真源（2026-11-05 建立）
# =============================================================================
#
# 规则（改本文件前必读）
# --------------------
# 1. 这里登记的是「**不能作为截面选股变量**」的因子，理由必须是可复核的机制，
#    不是「IC 差」。IC 差由 DPP 自然淘汰，不需要手工拉黑。
# 2. 排除在 `rolling_grid_alla.select_features_for_year` 的 `quality` 上做**一次**，
#    覆盖四条入选路径：DPP 候选池 / 基本面保留席位 / `_reserve_alt` 另类席位 /
#    两处 `_extra` 兜底。因此排除后不会从旁路漏回。
# 3. **与 `--exclude-features` 的分工**：那个是实验消融开关（临时、CLI 传入、
#    需要独立 out-tag）；这里是审查结论（永久、进版本库、需要证据）。
# 4. 移除条目 = 改口径，必须重跑 select 并说明理由；不许为了「多一个特征」删条目。
# 5. 判据来自 `factor/validation.py::check_panel_variation`
#    （当日截面唯一值 / 有效样本 < 1% ⇒ 无截面信息）。
#
# 背景（2026-11-05）
# -----------------
# 修复 `winsorize_mad` 的 MAD=0 守卫后，假面板从 46 个降到 11 个。逐个回查**原始
# 面板**（未裁剪未中性化）发现：这 11 个在进中性化之前截面唯一值就是 1 —— 中性化
# 没有 bug，它只是忠实放大了「无截面差异」这个输入事实。其中 3 个是 builder 实现
# 错误（`float_mktcap` 被 clip 削平、`is_st`/`express_reporting` 把布尔 0 当缺失），
# 已修（见各自 builder 注释）；剩下 8 个是**口径错**，登记在本文件。
#
# 🚨 注意：宏观信息本身不是不能用，但必须**与截面变量交互**才能变成截面因子。
#    反例（保留在池内）：`alt_macro_surprise_str5_x_vol20` 把宏观超预期乘以个股
#    20 日波动，原始面板截面唯一值 5546 ⇒ 真截面变量。要复活上面 6 个宏观因子，
#    走这条路，而不是解禁原面板。
# =============================================================================

