# ============================================================
# YuriQuant 个人量化研究系统 - 全局配置
# ============================================================

# --- 数据源配置 ---
datasource:
  # 数据源类型: amazing_data | csv | akshare
  # 切换数据源只需改 type，不用动业务代码
  type: amazing_data

  amazing_data:
    # 真实凭证请通过环境变量 AMAZINGDATA_USER / AMAZINGDATA_PWD 注入
    # 这里仅占位，代码里优先读环境变量
    username: ${AMAZINGDATA_USER:}
    password: ${AMAZINGDATA_PWD:}
    host: ${AMAZINGDATA_HOST:}
    port: ${AMAZINGDATA_PORT:0}
    # SDK 本地缓存目录（AmazingData 自带的 is_local 方案，SDK 内部用 pickle 格式）
    sdk_local_path: e://data//sdk_cache//

  csv:
    # 备用 CSV 数据源：指向一个目录，里面按 表名/代码.csv 组织
    root: e://data//csv//

# --- 本地缓存（自建 Parquet 层，在数据源之上） ---
cache:
  # 自建 Parquet 缓存根目录
  root: e://data//parquet//
  # 压缩方式: snappy | zstd | gzip
  compression: snappy

# --- 股票池配置 ---
universe:
  # 默认股票池: hs300 | zz500 | all_a | custom
  default: hs300
  # 指数成分股相关
  index_code: "000300.SH"   # 沪深300
  # 是否使用后复权
  adjust: backward           # backward | forward | none

# --- 交易日历 ---
calendar:
  # 市场代码: SSE | SZSE | BSE | A
  market: A

# --- 数据拉取默认范围 ---
fetch:
  # 默认起始日期（8位整型，SDK 约定）
  # 对齐 discipline.begin=20220101：挖因子/模型类算法允许消费的数据下限。
  # 短于该值会导致三段切分退化，禁止再改回更晚的日期而不同步修 discipline。
  begin_date: 20220101
  # end_date 留空表示"至今"，由代码动态取 calendar[-1]
  end_date: null

# --- 分钟频率数据（日内研究） ---
minute:
  # 要拉取缓存的分钟档位（分钟数，可选 1/3/5/10/15/30/60/120，对应手册 Period.minN）
  # 5 分钟为日内研究标准档位；空列表 [] 表示不拉分钟数据
  periods: [5]

# --- 因子预处理 ---
preprocessing:
  # 总开关：false 时回测直接用原始因子值
  enabled: true
  # 去极值方式: mad | quantile | null
  winsorize: mad
  # 标准化方式: zscore | rank | null
  standardize: zscore
  # 中性化开关（真实数据模式下生效；mock 模式无行业/市值数据自动跳过）
  neutralize_industry: true
  neutralize_size: true
  # 市值口径: tot_share(总市值) | float_share(流通市值)
  market_cap_field: tot_share
  # 行业分类级别（申万一级=1）
  industry_level: 1

# --- 训练纪律（L2 段落契约：冻结日历单一真源） ---
discipline:
  # 所有搜索/训练类算法（穷举/GP/GFlowNet/RL/stacking/predictor）允许消费的数据硬上限。
  # test 段（valid_end 之后）只允许两件事：walk_forward 型最终验证、上线后监控；
  # 绝不参与挖掘/筛选/调参/入库决策。对齐 scripts/evaluation/walk_forward.py 三段式纪律。
  begin: 20220101        # 定型期起点
  train_end: 20231231    # train 段结束（挖掘/粗筛）
  valid_end: 20241231    # valid 段结束（筛选/定权重）；之后为冻结 test 段

# --- 因子库（Factor Library / Factor Zoo）---
factor_library:
  # 因子持久化根目录：registry.csv + panels/*.parquet + evals/*.parquet
  root: e://data//factor_library//

# --- 文本挖掘（data/textmining + scripts/textmining）---
textmining:
  # 本地 FinBERT 模型目录（hf-mirror 下载的 finbert-tone-chinese，非代码仓库内容）
  bert_model_dir: e://data//models//finbert_tone_chinese

# --- 生产化监控（monitoring/ 包；因子与模型预测的性能监控调度）---
monitoring:
  window: 60                 # 近期短窗（交易日，IC 漂移 / 覆盖 / 单调性按此；灵敏提前预警）
  window_long: 252           # 近期长窗（交易日 ≈ 12 个月，稳健确认，抗噪音）
  max_stale_days: 7          # 数据新鲜度告警：面板落后数据源超过 N 个交易日 → warning
  min_coverage: 0.5          # 近期窗口截面覆盖率下限
  warn_ic_retention: 0.5     # 近期 IC < 期望（全期或上线基线）的 50% → warning；翻负 → critical
  min_monotonicity: 0.5      # 分位单调性下限（模型因子：结构恶化先于 IC 归零，作退出预警；0.8 对未筛选的原始因子库过严）
  min_t_nw_recent: 1.0       # 模型因子近期 Newey-West t 下限（显著性丢失 → warning）
  ledger_root: reports/monitoring   # 快照 / 告警账本与 HTML 报告输出目录

# --- 交易成本（全项目唯一真源）---
# 2026-09-10 收敛：此前费率分散在两处——`backtest` 段（佣金万1 / 滑点 5bp，引擎缺省值）
# 与 `model_portfolio` 段（万3 / 10bp，生产管线 default_costs()），两套数字差 2~3 倍、
# 互相不可比（网格实验选出的最优参数无法用引擎默认复跑）。
# 现统一到本段：引擎缺省值、scripts/run_model_portfolio.default_costs()、
# select_stocks 的空头成本一律读这里。取值口径 = 生产管线已验证的那套
# （全A Top10% 含成本结论即基于此）。
# ⚠️ 改这里 = 改全项目默认成本，会同步改变一切**未显式传 TransactionCosts** 的回测结果
#    （backtest_two_periods / e2e_backtest / multiyear_oos / gp_tune_budget /
#     optimize.multi_period / research.factor_library 的 canonical 回测等）。
costs:
  commission_rate: 0.0003    # 双边佣金万3
  commission_min: 5.0        # 单笔最低佣金5元
  stamp_duty: 0.001          # 印花税卖出千1
  slippage_bp: 10            # 滑点 10bp
  # 空头腿成本（修正空头腿乐观偏差：多空策略借券费按日计提、保证金占用报告）
  short_borrow_rate: 0.08    # 年化借券费率（A股融券常见 8%~10%；0=关闭）
  short_margin_ratio: 1.0    # 融券保证金比例（监管最低 100% = 1.0）

# --- 回测默认参数（费率不在这里，见上面的 `costs` 段）---
backtest:
  initial_capital: 100000   # 初始资金 10万
  rebalance_freq: M          # D=日 / W=周 / M=月调仓
  benchmark: "000300.SH"

# --- 对照基准指数（各报告/策略"与谁比"的唯一真源，2026-09-11 收敛）---
# 此前指数字面量散落在 5 处：本段 backtest.benchmark、model_portfolio.benchmark、
# scripts/rolling_grid_alla.BENCH_INDEX、scripts/jq_style_report.BENCH_INDEX、
# scripts/run_etf_rotation.BENCH（另有 scripts/textmining/* 4 处待随其链路一并处理）。
# ⚠️ 四者**取值本就不同**（用途不同，不是同一概念的重复），故按用途分键，
#    不合并成一个值——合并会静默改掉某条链路的对照基准。
# 消费方走 Config.benchmarks()。
benchmarks:
  default: "000300.SH"                        # 引擎缺省对照（同 backtest.benchmark）
  all_a: "000001.SH"                          # 全A组合对照（上证指数）
  etf: "000300.SH"                            # ETF 轮动对照（沪深300）
  report_a_share: "399317.SZ"                 # 全A报告图表对照（国证A指；中证全指 000985 行情缺失的替代）
  report_a_share_label: "国证A指(399317)≈中证全指"

# --- 模型增强组合默认配置（2026-09-09 升级：全A · 因子层正交化 · ens_h1h5 集成）---
# 升级依据（reports/alla_rolling 三臂对比 + 消融 + 集成实验，2018-2026 样本外含成本）：
#   - 股票池：全A（含退市回补，无幸存者偏差）
#   - 因子层：全因子正交化（panels_neu：MAD 去极值→行业+市值中性化→zscore），
#     三臂对比 +1.6pp/年（增量主要来自量价因子）；仅对基本面做被证伪（≈0）
#   - 特征选择：DPP + 基本面/股东族保留席位 8（消融 +0.7pp/年）
#   - 模型：gbdt，h1+h5 秩平均集成（集成增益 +1.5pp）
#   - 信号层：raw 不做中性化（因子层已正交，信号层再剔 = 过度中性化 −5.4pp）
#   - 组合：月频 Top10% 等权（日频被成本杀死 −52pp/年）
#   - 头部实现 ens_h1h5·M·raw·Top10%：年化 15.5%、超额上证 +13.3%/年、Sharpe 0.63
#     （reports/alla_rolling_ortho/metrics_ensemble.csv + metrics_overall.csv）
# 前置：reports/alla_rolling/_base（rolling_grid_alla --stage prep 重建）
#       + all_a_2018_2026 数据集（panels 与 panels_neu）
model_portfolio:
  # ---- 管线口径 ----
  pipeline: alla_ortho        # all_a_2018_2026 数据集 + panels_neu 因子层正交化
  ensemble_horizons: [1, 5]   # h1+h5 秩平均集成（成员模型均为 gbdt）
  model: gbdt
  strategy: topfrac_lo
  frac: 0.10                  # Top10% 等权（Top20% 次优）
  rebalance_freq: M
  neutralize: false           # 信号层 raw——因子层已正交，勿再叠加
  selection_cut: auto         # 特征选择质量窗截止=最新完整交易日（生产口径，较实验冻结口径更新）
  # ---- 训练（沿用实验验证值，与 rolling_grid_alla 模块常量一致）----
  train_window: 500           # 滚动训练窗
  n_folds: 4                  # 年内季度再训练
  quality_window: 500         # 特征选择 IC 质量窗
  # ---- 成本 ----
  # 费率不在这里：全项目唯一真源是顶层 `costs` 段（2026-09-10 收敛）。
  # 生产管线通过 scripts/run_model_portfolio.default_costs() 读它，勿在别处写费率字面量。
  test_note: "全A正交化管线 ens_h1h5：2018-2026 样本外超额上证 +13.3%/年（Sharpe 0.63）"
