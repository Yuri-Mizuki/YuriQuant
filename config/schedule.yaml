# YuriQuant 定时任务单一登记表
#
# 为什么需要它
# ------------
# 2026-09-21 前，任务注册逻辑散落在三处（`alla_daily_rank` / `fetch_altdata_daily` /
# 已归档的 `daily_pipeline`），README 只有一张手写速查表；且全部走 `schtasks /Create`
# 裸参数形式，继承了 Windows 默认的电池条件 —— 2026-09-21 三个任务同日同码
# （-1073741510 = 0xC000013A）全部被杀、零产物。
#
# 本表是**机器可读真源**，由 `scripts.common.task_scheduler` 消费：
#
#   python -m scripts.common.task_scheduler doctor           # 体检：漂移 / 结果码 / 产物新鲜度
#   python -m scripts.common.task_scheduler list             # 系统里实际存在的 YuriQuant 任务
#   python -m scripts.common.task_scheduler install <key>    # 按本表重注册（改完表再跑）
#   python -m scripts.common.task_scheduler show <key>       # 只看将写入的 XML
#   python -m scripts.common.task_scheduler remove <key>     # 删除
#
# 🚨 改完本表后跑 `install <key>` 重注册，任务里的**绝对路径**与参数才会同步；
#    只改表不重注册 = 表与系统脱钩（doctor 会报，因为时间/参数核对不上）。
#
# 2026-10-10 事故复盘（重要，别照抄 09-21 的归因）
# ------------------------------------------------
# 出榜/另类两个任务连续两周 rc=0xC000013A、产物停 09-22/09-23。查明：本机只支持
# **S0 现代待机**，傍晚 18:30–19:43 固定进待机 ⇒ 17:30 启动、要跑 1–2h 的任务正撞
# 进待机窗口，进程被挂起/强杀。**电池两条条件早已是 false，不是本次根因。**
# 三处修复：① 脚本内 keep_system_awake 运行期保持唤醒（scripts/common/power.py）；
# ② 任务加 `--log-file` 落盘（此前无 stdout 重定向、失败零痕迹）；
# ③ 脚本的 `--install-task` 一律转调 install_from_registry（注册单点 = 本表）。
#
# status 取值：
#   active   —— 应在系统里注册并运行（doctor 会核对存在性/条件/结果码/产物）
#   planned  —— 代码支持但**有意未启用**（doctor 不报漂移）
#   retired  —— 已退休，不应存在于系统（若仍在，doctor 报异常）
#
# system 取值：
#   schtasks  —— Windows 计划任务（doctor 可自动核对）
#   workbuddy —— WorkBuddy 自动化（脚本无法枚举，需人工核对）

version: 1
updated: '2026-10-10'

tasks:
  - key: alla_daily_rank
    name: 'YuriQuant AllaDailyRank'
    system: schtasks
    status: active
    time: '17:30'
    schedule: daily
    command: 'D:\python\Python312\python.exe'
    arguments: '"E:\YuriQuant\scripts\pipelines\alla_daily_rank.py" --preset dingban --log-file logs\alla_daily_rank_task_{date}.log'
    working_dir: 'E:\YuriQuant'
    execution_limit: PT3H
    product_glob: 'reports/alla_daily_defv/ranking_*.csv'
    description: 'YuriQuant 全A每日出榜（定版口径：fundind 快信号 h1020 ⊕ 慢信号 s0.5 + buffer(15/40)，全流程约 15–60 分钟）'
    notes: >-
      2026-10-10 切定版：`--preset dingban` ⇒ 特征源 panels_neu_fundind / 信号
      h1020⊕s0.5 / 策略 BufferedTopFracLongOnly(0.15,0.40)，产物落
      `reports/alla_daily_defv/`（旧 legacy 口径产物在 `reports/alla_daily/`，停于 09-22）。
      `--log-file` = 失败留痕（此前任务无 stdout 重定向、失败零痕迹）；脚本内
      keep_system_awake 防傍晚 S0 现代待机中断（2026-10-10 事故根因）。
      下游 = daily_report（19:00 读 reports/alla_daily_defv/），缓冲 30 分钟。

  - key: altdata_daily
    name: 'YuriQuant AltDataDaily'
    system: schtasks
    status: active
    time: '18:00'
    schedule: daily
    command: 'D:\python\Python312\python.exe'
    arguments: '"E:\YuriQuant\scripts\pipelines\fetch_altdata_daily.py" --tables all --log-file logs\altdata_daily_task_{date}.log'
    working_dir: 'E:\YuriQuant'
    execution_limit: PT3H
    product_glob: 'E:/data/parquet/_alt_meta.json'
    description: 'YuriQuant 另类数据日更（akshare：质押/增减持/高管持股/宏观日历/财联社/新闻）'
    notes: >-
      🔧 2026-10-10 解释器订正：**改用系统 Python**（原写 .venv）。实测 akshare
      1.18.56 只装在系统 Python、`.venv` 已无 akshare ⇒ 任务 `_check_interpreter`
      直接 SystemExit(2)（任务层表现为 rc=0x80070002 文件未找到、产物停 09-23）。
      原「必须 .venv（akshare 是本地 wheel，进不了 uv.lock）」的口径已过时：系统
      Python 不受 `uv sync` 影响，反而更稳。若日后重装，请仍装进系统 Python。
      与出榜并行无依赖；`--log-file` = 失败留痕；脚本内 keep_system_awake 防 S0 待机中断。

  - key: daily_report
    name: 'WorkBuddy 自动化：全A出榜日报邮件推送'
    system: workbuddy
    status: active
    time: '19:00'
    schedule: '工作日（周一至周五）'
    automation_id: 3b31c720-1e3b-4eab-bd0b-db35c7213311
    product_glob: 'reports/alla_daily_defv/email_body_*.html'
    description: '检查当日榜单 → 更新生产口径 IC 台账 → 生成日报正文 → 邮件推送 163'
    notes: >-
      判断型任务（判日/重试/附件降级），刻意不并入 schtasks。2026-10-10 随出榜链切定版
      口径，读盘目录同步改 `reports/alla_daily_defv/`（build_daily_email_body.py /
      monitor_production_ic.py 默认值已改）；旧 legacy 产物停在 `reports/alla_daily/`。
      ⚠️ 该自动化当前 status=PAUSED（待用户决定是否开启——开则需先补 09-22 以来的缺口数据）。

  - key: monitor
    name: 'YuriQuant Monitor'
    system: schtasks
    status: retired
    time: '17:30'
    description: '旧因子库监控链（绑 hs300_2022_2025，行情源 2026-08-26 停更）'
    notes: '2026-09-21 停用后退休：改指 all_a 实测 686 个因子因面板或 eval 缺失被跳过'

  - key: altdata_cls_backfill
    name: 'YuriQuant AltDataClsBackfill'
    system: schtasks
    status: planned
    time: '17:30'
    schedule: daily
    command: 'D:\python\Python312\python.exe'
    arguments: >-
      "E:\YuriQuant\scripts\pipelines\fetch_altdata_daily.py" --tables cls
      --cls-backfill --cls-max-pages 3000
    working_dir: 'E:\YuriQuant'
    execution_limit: PT3H
    description: '财联社历史回补续跑推进器（断点续传；回补完成后自动空转）'
    notes: '回补期需要；回补完成后可长期挂着，不必删任务。当前未启用'

  - key: altdata_news
    name: 'YuriQuant AltDataNews'
    system: schtasks
    status: planned
    time: '09:00'
    schedule: minute
    every_minutes: 10
    end_time: '21:00'
    command: 'D:\python\Python312\python.exe'
    arguments: '"E:\YuriQuant\scripts\pipelines\fetch_altdata_daily.py" --tables news'
    working_dir: 'E:\YuriQuant'
    execution_limit: PT1H
    description: '高频新闻快照（09:00–21:00 每 10 分钟）'
    notes: '引入财联社可回补源后价值大幅下降（同花顺/新浪只有 20 条无历史快照），默认不装'
