# YuriQuant 定时任务单一登记表
#
# 为什么需要它
# ------------
# 2026-09-21 前，任务注册逻辑散落在三处（`alla_daily_rank` / `fetch_altdata_daily` /
# 已归档的 `daily_pipeline`），README 只有一张手写速查表；且全部走 `schtasks /Create`
# 裸参数形式，继承了 Windows 默认的电池条件 —— 2026-09-21 三个任务同日同码
# （-1073741510 = 0xC000013A）全部被杀、零产物。
#
# 本表是**机器可读真源**，由 `scripts.common.task_scheduler` 消费：
#
#   python -m scripts.common.task_scheduler doctor           # 体检：漂移 / 结果码 / 产物新鲜度
#   python -m scripts.common.task_scheduler list             # 系统里实际存在的 YuriQuant 任务
#   python -m scripts.common.task_scheduler install <key>    # 按本表重注册（改完表再跑）
#   python -m scripts.common.task_scheduler show <key>       # 只看将写入的 XML
#   python -m scripts.common.task_scheduler remove <key>     # 删除
#
# 🚨 改完本表后跑 `install <key>` 重注册，任务里的**绝对路径**与参数才会同步；
#    只改表不重注册 = 表与系统脱钩（doctor 会报，因为时间/参数核对不上）。
#
# 2026-10-10 事故复盘（重要，别照抄 09-21 的归因）
# ------------------------------------------------
# 出榜/另类两个任务连续两周 rc=0xC000013A、产物停 09-22/09-23。查明：本机只支持
# **S0 现代待机**，傍晚 18:30–19:43 固定进待机 ⇒ 17:30 启动、要跑 1–2h 的任务正撞
# 进待机窗口，进程被挂起/强杀。**电池两条条件早已是 false，不是本次根因。**
# 三处修复：① 脚本内 keep_system_awake 运行期保持唤醒（scripts/common/power.py）；
# ② 任务加 `--log-file` 落盘（此前无 stdout 重定向、失败零痕迹）；
# ③ 脚本的 `--install-task` 一律转调 install_from_registry（注册单点 = 本表）。
#
# status 取值：
#   active   —— 应在系统里注册并运行（doctor 会核对存在性/条件/结果码/产物）
#   planned  —— 代码支持但**有意未启用**（doctor 不报漂移）
#   retired  —— 已退休，不应存在于系统（若仍在，doctor 报异常）
#
# system 取值：
#   schtasks  —— Windows 计划任务（doctor 可自动核对）
#   workbuddy —— WorkBuddy 自动化（脚本无法枚举，需人工核对）
#
# --- 多机适配（2026-10-13）------------------------------------------------
# 本表是 tracked 文件，但里面的**解释器/仓库/数据盘路径**只对某台机器成立。
# 因此一律写成 ${VAR:默认值} 占位符，由 `scripts.common.task_scheduler` 经
# `config.expand_env` 展开（config 导入时已加载仓库内 .env）：
#   ${YQ_PYTHON:...}    解释器绝对路径（另一台机器 python 装别处时改环境变量）
#   ${YQ_REPO:...}      仓库根（工作区搬到别的盘时改环境变量）
#   ${YQ_DATA_ROOT:...}  数据根（与 config/settings.yaml 同一约定）
# ⚠️ 默认值 = 本机当前取值 ⇒ **本机展开结果与改前逐字相同，零漂移、无需重注册**；
#    换机器时只需设环境变量，再 `install <key>` 重注册一次。
# --------------------------------------------------------------------------

version: 1
updated: '2026-10-15'

tasks:
  - key: rebuild_panels
    name: 'YuriQuant RebuildPanels'
    system: schtasks
    status: active
    time: '06:00'
    schedule: daily
    command: '${YQ_PYTHON:D:\python\Python312\python.exe}'
    arguments: >-
      "${YQ_REPO:E:\YuriQuant}\scripts\pipelines\rebuild_panel_library.py" --run
      --log-file logs\rebuild_panels_task_{date}.log
    working_dir: '${YQ_REPO:E:\YuriQuant}'
    execution_limit: PT6H
    description: '因子库面板月度重建（守卫式：panels_neu 已覆盖上月即空转 ⇒ 实跑约每月一次、数小时）'
    notes: >-
      2026-10-15 新增。为什么：定版口径的**慢信号** s0.5 直接读离线 `panels_neu` 的
      月末截面（`fundamental_blend::build_slow_panel`），而该面板是批处理产物、
      不随新数据更新 —— 此前 schedule.yaml 无任何任务负责它，导致慢信号长期停在
      最后一次手工重建的数据态（2026-10-10 建于止 09-01，滞后一个月余）。
      链路 = `rolling_grid_alla --stage prep`（_base）→ 16 个族 builder（panels）
      → `build_alla_factor_neutralized(_fundind)`（两套面板）。**顺序敏感**：
      `_base` 更新后必须同批重跑中性化（否则面板与数据不同版本，
      `reports/prod_pipeline_gap/report.md` §5.6 实测 |Δ|>1e-3 占 22.91%）。
      守卫（脚本内，task_scheduler 无 monthly 触发器）：`panels_neu` 覆盖末日
      ≥ 上一个自然月最后交易日 ⇒ 空转退出；另设 **16:00–20:00 出榜链窗口保护**
      （重建期间面板半新半旧，若撞上 17:30 出榜，慢信号会读到混合面板）。
      `product_glob` 故意留空：月频产物 mtime 必然早于最近交易日，填了 doctor 会长期
      报"未覆盖"而稀释真告警；覆盖率核对改用
      `python -m scripts.pipelines.rebuild_panel_library --status`。

  - key: alla_daily_rank
    name: 'YuriQuant AllaDailyRank'
    system: schtasks
    status: active
    time: '18:30'
    schedule: daily
    command: '${YQ_PYTHON:D:\python\Python312\python.exe}'
    arguments: '"${YQ_REPO:E:\YuriQuant}\scripts\pipelines\alla_daily_rank.py" --preset dingban --log-file logs\alla_daily_rank_task_{date}.log'
    working_dir: '${YQ_REPO:E:\YuriQuant}'
    execution_limit: PT3H
    product_glob: 'reports/alla_daily_defv/ranking_*.csv'
    description: 'YuriQuant 全A每日出榜（定版口径：fundind 快信号 h1020 ⊕ 慢信号 s0.5 + buffer(15/40)，全流程约 15–60 分钟）'
    notes: >-
      2026-10-10 切定版：`--preset dingban` ⇒ 特征源 panels_neu_fundind / 信号
      h1020⊕s0.5 / 策略 BufferedTopFracLongOnly(0.15,0.40)，产物落
      `reports/alla_daily_defv/`（旧 legacy 口径产物在 `reports/alla_daily/`，停于 09-22）。
      `--log-file` = 失败留痕（此前任务无 stdout 重定向、失败零痕迹）；脚本内
      keep_system_awake 防傍晚 S0 现代待机中断（2026-10-10 事故根因）。
      **2026-10-15 时点 17:30→18:30（由莉酱拍板）**：10-12~15 连续四晚任务死于
      安全软件 ~17:30-45 维护窗口（SCM 7045 服务安装 + sgepfsfilter 过滤驱动加载，
      python 进程 0xC0000142 DLL_INIT_FAILED；10-14 同窗口整机重启）——避开该窗口；
      另配 RestartOnFailure 3×30min + WakeToRun 兜底。下游 = daily_report
      （20:00 读 reports/alla_daily_defv/），缓冲 30 分钟。

  - key: altdata_daily
    name: 'YuriQuant AltDataDaily'
    system: schtasks
    status: active
    time: '18:00'
    schedule: daily
    command: '${YQ_PYTHON:D:\python\Python312\python.exe}'
    arguments: '"${YQ_REPO:E:\YuriQuant}\scripts\pipelines\fetch_altdata_daily.py" --tables all --log-file logs\altdata_daily_task_{date}.log'
    working_dir: '${YQ_REPO:E:\YuriQuant}'
    execution_limit: PT3H
    # 修 2026-10-13：原写 'E:/data/parquet/_alt_meta.json'（09-20 迁移前口径）——
    # 而任务实际写盘在 Config.cache().root（本机 D:），doctor 的新鲜度核对因此
    # 一直在读**旧副本**（E 盘那份停在 10-11）。改为与 settings.yaml 同源的占位符。
    product_glob: '${YQ_DATA_ROOT:D:/data}//parquet//_alt_meta.json'
    description: 'YuriQuant 另类数据日更（akshare：质押/增减持/高管持股/宏观日历/财联社/新闻）'
    notes: >-
      🔧 2026-10-10 解释器订正：**改用系统 Python**（原写 .venv）。实测 akshare
      1.18.56 只装在系统 Python、`.venv` 已无 akshare ⇒ 任务 `_check_interpreter`
      直接 SystemExit(2)（任务层表现为 rc=0x80070002 文件未找到、产物停 09-23）。
      原「必须 .venv（akshare 是本地 wheel，进不了 uv.lock）」的口径已过时：系统
      Python 不受 `uv sync` 影响，反而更稳。若日后重装，请仍装进系统 Python。
      与出榜并行无依赖；`--log-file` = 失败留痕；脚本内 keep_system_awake 防 S0 待机中断。

  - key: daily_report
    name: 'WorkBuddy 自动化：全A出榜日报邮件推送'
    system: workbuddy
    status: active
    time: '20:00'
    schedule: '工作日（周一至周五）'
    automation_id: 3b31c720-1e3b-4eab-bd0b-db35c7213311
    product_glob: 'reports/alla_daily_defv/email_body_*.html'
    description: '检查当日榜单 → 更新生产口径 IC 台账 → 生成日报正文 → 邮件推送 163'
    notes: >-
      判断型任务（判日/重试/附件降级），刻意不并入 schtasks。2026-10-10 随出榜链切定版
      口径，读盘目录同步改 `reports/alla_daily_defv/`（build_daily_email_body.py /
      monitor_production_ic.py 默认值已改）；旧 legacy 产物停在 `reports/alla_daily/`。
      ⚠️ 该自动化当前 status=PAUSED（待用户决定是否开启——开则需先补 09-22 以来的缺口数据）。
      **2026-10-15 随出榜链 17:30→18:30 同步把目标时点记为 20:00（保持 30 分钟缓冲）——
      本表只是登记，WorkBuddy 端的实际触发时间需用户解封时自行同步修改。**

  - key: monitor
    name: 'YuriQuant Monitor'
    system: schtasks
    status: retired
    time: '17:30'
    description: '旧因子库监控链（绑 hs300_2022_2025，行情源 2026-08-26 停更）'
    notes: '2026-09-21 停用后退休：改指 all_a 实测 686 个因子因面板或 eval 缺失被跳过'

  - key: altdata_cls_backfill
    name: 'YuriQuant AltDataClsBackfill'
    system: schtasks
    status: planned
    time: '17:30'
    schedule: daily
    command: '${YQ_PYTHON:D:\python\Python312\python.exe}'
    arguments: >-
      "${YQ_REPO:E:\YuriQuant}\scripts\pipelines\fetch_altdata_daily.py" --tables cls
      --cls-backfill --cls-max-pages 3000
    working_dir: '${YQ_REPO:E:\YuriQuant}'
    execution_limit: PT3H
    description: '财联社历史回补续跑推进器（断点续传；回补完成后自动空转）'
    notes: '回补期需要；回补完成后可长期挂着，不必删任务。当前未启用'

  - key: altdata_news
    name: 'YuriQuant AltDataNews'
    system: schtasks
    status: planned
    time: '09:00'
    schedule: minute
    every_minutes: 10
    end_time: '21:00'
    command: '${YQ_PYTHON:D:\python\Python312\python.exe}'
    arguments: '"${YQ_REPO:E:\YuriQuant}\scripts\pipelines\fetch_altdata_daily.py" --tables news'
    working_dir: '${YQ_REPO:E:\YuriQuant}'
    execution_limit: PT1H
    description: '高频新闻快照（09:00–21:00 每 10 分钟）'
    notes: '引入财联社可回补源后价值大幅下降（同花顺/新浪只有 20 条无历史快照），默认不装'
